<!doctype html>
<!-- OGZ CONTROL — v2 (July 4): simpler, calmer, on-brand (clone-in-a-snap v0.2.0 digital.app law).
     4 tabs (Now · Agents · Ask · More), single Electric-Green accent, generous whitespace.
     Agents view shows each agent's numbered WORKFLOW + the step it's on right now (live).
     Built on the portal — same key gate, same /static, same endpoints. Every control wired + tested. -->
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OGZ · Control</title>
<style>
@font-face{font-family:'Modern Era';src:url('/static/fonts/modern-era-extrabold.ttf') format('truetype');font-weight:800;font-display:swap}
@font-face{font-family:'Modern Era';src:url('/static/fonts/modern-era-black.ttf') format('truetype');font-weight:900;font-display:swap}
:root{
  --bg:#0F0F0E; --card:#161614; --card2:#1e1e1c; --line:#252523; --line2:#33332f;
  --ink:#F4F5F0; --mut:#9a9b90; --dim:#63645b;
  --green:#33EB05; --green-dim:#0e2a06; --ultra:#6b8aff; --epink:#E602BB;
  --display:'Modern Era',-apple-system,'SF Pro','Segoe UI',system-ui,sans-serif; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,"SF Pro","SF Arabic","Segoe UI",system-ui,sans-serif}
body{padding-bottom:40px}
button{font:inherit;border:0;cursor:pointer;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,textarea{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:.7em .9em;outline:none}
textarea:focus,input:focus{border-color:var(--green)}
::placeholder{color:var(--dim)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* header */
#hdr{position:sticky;top:0;z-index:30;background:rgba(15,15,14,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:13px 20px 0}
.hrow{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
#logo{height:24px;filter:drop-shadow(0 0 10px rgba(51,235,5,.4))}
#mark{font-family:var(--display);font-weight:900;font-size:16px;letter-spacing:.5px;text-transform:uppercase}
#live{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
#sys{margin-inline-start:auto;font-size:12px;color:var(--dim)}
#tabs{max-width:760px;margin:14px auto 0;display:flex;gap:4px}
.tab{flex:1;padding:.6em 0;text-align:center;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.4px;
  text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;transition:.15s}
.tab.on{color:var(--ink);border-bottom-color:var(--green)}

/* stage */
#stage{max-width:760px;margin:0 auto;padding:22px 20px}
.h1{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:0 0 14px}
.h1:not(:first-child){margin-top:34px}
.big{font-family:var(--display);font-weight:900;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card+.card{margin-top:12px}
.muted{color:var(--mut)}.dim{color:var(--dim)}
.grn{color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dim)}
.dot.on{background:var(--green);box-shadow:0 0 7px var(--green);animation:pulse 2s infinite}
.dot.recent{background:#b9a94a}.dot.idle{background:var(--dim)}.dot.bad{background:var(--epink)}

/* NOW hero */
.hero .state{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px}
.hero .line{color:var(--mut);margin-top:12px;font-size:14.5px;line-height:1.55}
.hero .meta{color:var(--dim);font-size:13px;margin-top:14px;line-height:1.8}
.hero .meta b{color:var(--ink);font-weight:600}
.strip{display:flex;gap:10px;margin-top:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .n{font-family:var(--display);font-weight:900;font-size:20px}
.stat .l{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}

/* AGENTS */
.note{color:var(--mut);font-size:13.5px;line-height:1.6;margin-bottom:6px}
.note b{color:var(--green)}
.livebar{display:flex;gap:9px;align-items:center;background:var(--green-dim);border:1px solid #1c3a10;border-radius:12px;
  padding:11px 14px;margin:12px 0 18px;font-size:13.5px}
.agent{border-bottom:1px solid var(--line);padding:16px 2px}
.agent:last-child{border-bottom:0}
.arow{display:flex;align-items:center;gap:11px}
.aname{font-weight:700;font-size:15.5px}
.astep{margin-inline-start:auto;font-size:12.5px;color:var(--green);font-weight:700;white-space:nowrap}
.astep.idle{color:var(--dim);font-weight:600}
.asub{color:var(--mut);font-size:13px;margin-top:5px;padding-inline-start:19px;line-height:1.5}
.asub .k{color:var(--green);font-size:11px;font-weight:700}
.chev{margin-inline-start:8px;color:var(--dim);transition:.2s}.agent.open .chev{transform:rotate(90deg)}
.wf{display:none;padding:12px 0 4px 19px}.agent.open .wf{display:block}
.step{display:flex;gap:11px;padding:7px 0;font-size:13.5px;line-height:1.5;color:var(--mut)}
.step .num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;
  font-size:11px;font-weight:800;color:var(--dim)}
.step.done{color:var(--dim)}.step.done .num{border-color:var(--line);color:var(--dim)}
.step.cur{color:var(--ink)}.step.cur .num{background:var(--green);border-color:var(--green);color:#04180e}
.step.cur{background:var(--green-dim);border-radius:10px;margin:2px -8px;padding:8px}
/* per-agent mini chat */
.achat{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.achat-head{font-size:12.5px;font-weight:700;color:var(--green);margin-bottom:8px}
.amsgs{display:flex;flex-direction:column;gap:7px;max-height:320px;overflow:auto;margin-bottom:9px}
.amsg{max-width:90%;padding:8px 11px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.amsg.u{align-self:flex-end;background:#1a1f14;border:1px solid #2c3a1c}
.amsg.b{align-self:flex-start;background:var(--card2);border:1px solid var(--line2)}
.amsg.think{color:var(--dim);font-style:italic}
.ain{display:flex;gap:7px}
.ain textarea{flex:1;min-height:40px;max-height:110px;resize:none;font-size:14px}
.ain button{flex:0 0 auto;width:46px;border-radius:11px;background:var(--green);color:#04180e;font-weight:900;font-size:18px}

/* JUDGE — inline verdict (clones /dashboard controls, calm v2) */
.tbadge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;margin-inline-start:5px;
  border-radius:99px;background:var(--green);color:#04180e;font-size:10px;font-weight:900;vertical-align:middle;line-height:1}
.jnote{color:var(--mut);font-size:13px;line-height:1.6;margin-bottom:14px}.jnote b{color:var(--green)}
.jnote a{color:var(--green);font-weight:700}
.jbatch{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:11px 14px;margin-bottom:16px;font-size:13px;color:var(--mut)}
.jbatch b{color:var(--ink);font-weight:700}
.jcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;overflow:hidden}
.jcard.done{opacity:.62}
.jhead{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.jhandle{font-weight:800;font-size:15px}
.jmeta{margin-inline-start:auto;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.jimg{display:block;width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:11px;background:var(--card2)}
.jseclbl{font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:12px 0 5px}
.jcap{font-size:15px;line-height:1.6;color:var(--ink)}
.jctx{color:var(--mut);font-size:12.5px;line-height:1.55;margin-top:4px}
.jctx .k{color:var(--green);font-weight:700}
.jopt{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.jopt .oscore{display:inline-block;font-size:11px;font-weight:800;color:var(--green);border:1px solid #1c3a10;background:var(--green-dim);border-radius:99px;padding:.1em .6em;margin-bottom:6px}
/* verdict bar (mirrors dashboard #bar: approve/edit/kill + 0-10 + note) */
.vbar{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.vbtns{display:flex;gap:7px}
.vbtn{flex:1;padding:.62em 0;border-radius:11px;border:1px solid var(--line2);font-family:var(--display);font-weight:800;font-size:12.5px;
  letter-spacing:.4px;text-transform:uppercase;color:var(--mut);background:var(--card2);transition:.14s}
.vbtn.ap.on{background:var(--green);border-color:var(--green);color:#04180e}
.vbtn.ed.on{background:#b9a94a;border-color:#b9a94a;color:#1a1400}
.vbtn.ki.on{background:var(--epink);border-color:var(--epink);color:#fff}
.scorerow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:11px}
.scorerow .slbl{font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--dim);margin-inline-end:3px}
.sdot{width:26px;height:26px;border-radius:8px;border:1px solid var(--line2);background:var(--card2);color:var(--dim);font-size:12px;font-weight:800}
.sdot.on{background:var(--green);border-color:var(--green);color:#04180e}
.vnote{width:100%;margin-top:10px;font-size:14px}
.vsub{display:flex;gap:8px;align-items:center;margin-top:11px}
.vsubmit{flex:1;padding:.7em 0;border-radius:11px;background:var(--green);color:#04180e;font-weight:900;font-size:14px}
.vsubmit:disabled{background:var(--card2);color:var(--dim)}
.vstate{font-size:12px;color:var(--dim)}.vstate.ok{color:var(--green)}.vstate.err{color:var(--epink)}
.vdone{display:flex;align-items:center;gap:9px;font-size:13.5px;margin-top:4px}
.vdone .lbl{font-weight:700}.vdone.ap .lbl{color:var(--green)}.vdone.ki .lbl{color:var(--epink)}.vdone.ed .lbl{color:#b9a94a}
.vrev{margin-inline-start:auto;font-size:12px;color:var(--dim);border:1px solid var(--line2);border-radius:99px;padding:.2em .7em}

/* rows (More sub-views reuse these) */
.row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.rowb{flex:1;min-width:0}
.rt1{font-weight:600;font-size:15px}.rt2{color:var(--mut);font-size:13px;margin-top:3px;word-break:break-word}
.rtime{color:var(--dim);font-size:12px;white-space:nowrap}
.menu .row{cursor:pointer}.menu .row .rt1{font-size:16px}
.back{color:var(--green);font-weight:700;font-size:13px;margin-bottom:14px;display:inline-block}
.big-btn{display:block;text-align:center;padding:1em;border-radius:14px;background:var(--green);color:#04180e;font-weight:900;font-size:15px;margin:16px 0}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--green)}.bar>i.warn{background:#b9a94a}.bar>i.bad{background:var(--epink)}
.refresh{color:var(--green);font-weight:700;font-size:12.5px}
.empty{text-align:center;color:var(--mut);padding:48px 12px}.empty .e{font-size:40px;margin-bottom:10px}
.chip{display:inline-block;font-size:11px;font-weight:700;color:var(--dim);border:1px solid var(--line2);border-radius:99px;padding:.15em .6em}
.dayhdr{font-family:var(--display);font-size:11px;font-weight:800;letter-spacing:1px;color:var(--dim);text-transform:uppercase;margin:20px 0 6px}

/* chat */
#chatwrap{display:flex;flex-direction:column;min-height:calc(100vh - 210px)}
.chatnote{color:var(--mut);font-size:12.5px;line-height:1.55;margin-bottom:14px}.chatnote b{color:var(--green)}
#msgs{flex:1;display:flex;flex-direction:column;gap:11px;padding-bottom:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#1a1f14;border:1px solid #2c3a1c;border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.think{color:var(--dim);font-style:italic}
.msg .role{display:block;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;opacity:.7}
.msg.bot .role{color:var(--green)}
#chatbar{position:sticky;bottom:0;background:rgba(15,15,14,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:12px 0 calc(8px + env(safe-area-inset-bottom));display:flex;gap:9px;margin-top:8px}
#chatin{flex:1;min-height:46px;max-height:130px;resize:none}
#chatsend{flex:0 0 auto;width:54px;border-radius:12px;background:var(--green);color:#04180e;font-weight:900;font-size:20px}
#chatsend:disabled{background:var(--card2);color:var(--dim)}
</style>
</head>
<body>
<div id="hdr">
  <div class="hrow">
    <img id="logo" src="/static/ogz-mouth.svg" alt="OGZ" onerror="this.src='/static/ogz-mouth.png'">
    <span id="mark">Control</span><span id="live"></span>
    <span id="sys"></span>
  </div>
  <div id="tabs"></div>
</div>
<div id="stage"><div class="empty">…</div></div>

<script>
const K=new URLSearchParams(location.search).get('k')||'';
let WHO=null, AUTH=null, VIEW='now', SUB=null, POLL=null, CHATBUSY=false;
let JUDGE_N=0;   // live count of open judgeable cards → tab badge
const TABS=[['now','Now'],['judge','Judge'],['agents','Agents'],['chat','Ask'],['more','More']];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt$=n=>'$'+Number(n||0).toFixed(n<1?3:2);
async function fetchJSON(p){ try{const r=await fetch(p+(p.includes('?')?'&':'?')+'k='+encodeURIComponent(K),{cache:'no-cache'});
  if(!r.ok)return{ok:false,error:'HTTP '+r.status};return await r.json();}catch(e){return{ok:false,error:String(e)};} }
function rel(ts){ let s=typeof ts==='number'?ts:(Date.parse(ts)/1000); if(!s||isNaN(s))return'';
  const a=Date.now()/1000-s; if(a<60)return Math.max(1,a|0)+'s'; if(a<3600)return(a/60|0)+'m'; if(a<86400)return(a/3600|0)+'h'; return(a/86400|0)+'d'; }

async function whoami(){ const d=await fetchJSON('/api/approvals/whoami');
  if(!d||d.error){document.getElementById('stage').innerHTML='<div class="empty"><div class="e">🔑</div>المفتاح غلط أو ناقص</div>';return false;}
  WHO=d.judge; AUTH=d.auth; return true; }
function renderTabs(){ document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>{
  const badge=(k==='judge'&&JUDGE_N>0)?`<span class="tbadge">${JUDGE_N}</span>`:'';
  return `<button class="tab ${VIEW===k?'on':''}" onclick="go('${k}')">${l}${badge}</button>`;}).join(''); }
function go(v){ VIEW=v; SUB=null; if(POLL){clearInterval(POLL);POLL=null;} renderTabs(); render(); }
function render(){ const st=document.getElementById('stage'); st.innerHTML='<div class="empty">…</div>';
  if(VIEW==='now')return viewNow(st,true);
  if(VIEW==='judge')return viewJudge(st,true);
  if(VIEW==='agents')return viewAgents(st,true);
  if(VIEW==='chat')return viewChat(st);
  if(VIEW==='more')return viewMore(st); }
async function refreshSys(){ const d=await fetchJSON('/api/control/health');
  document.getElementById('sys').textContent=d&&d.ok?({healthy:'● healthy',degraded:'▲ degraded',critical:'✕ critical'}[d.status]||''):''; }
function errBox(d){ return `<div class="empty"><div class="e">⚠️</div>تعذّر التحميل<br><span class="mono dim" style="font-size:11px">${esc((d&&d.error)||'')}</span><br><button class="refresh" style="margin-top:12px" onclick="render()">↻ retry</button></div>`; }

/* ---------- NOW ---------- */
async function viewNow(st,poll){
  const [pl,bg,hl]=await Promise.all([fetchJSON('/api/control/pipeline'),fetchJSON('/api/control/budget'),fetchJSON('/api/control/health')]);
  const c=(pl.ok&&pl.current)||{}; const running=c.status==='RUNNING';
  let h=`<div class="card hero"><div class="state"><span class="dot ${running?'on':'idle'}"></span>${running?'Producing now':'Idle'}</div>`;
  if(pl.ok&&(pl.heartbeat||[]).length){ const last=pl.heartbeat[pl.heartbeat.length-1]; h+=`<div class="line" dir="auto">${esc(last.msg||'')}</div>`; }
  h+=`<div class="meta"><b>${esc(c.client||'—')}</b> · ${esc(c.stage||'—')} · ${esc((c.agent||'').split(' ')[0]||'')}<br>
    last activity ${c.last_activity?rel(c.last_activity)+' ago':'—'} · 🎯 ${esc(c.deadline||'')}</div></div>`;
  h+=`<div class="strip">
    <div class="stat"><div class="n ${hl.ok&&hl.status==='healthy'?'grn':''}">${hl.ok?(hl.status==='healthy'?'●':'▲'):'?'}</div><div class="l">system</div></div>
    <div class="stat"><div class="n">${bg.ok?fmt$(bg.today_usd):'—'}</div><div class="l">today</div></div>
    <div class="stat"><div class="n">${bg.ok?esc(bg.current_tier):'—'}</div><div class="l">tier</div></div></div>`;
  if(pl.ok&&(pl.heartbeat||[]).length>1){ h+=`<div class="h1">Recent</div><div class="card">`;
    for(const l of pl.heartbeat.slice(-6).reverse()) h+=`<div class="row"><span class="rtime grn mono">${esc(l.time||'')}</span><span class="rowb" dir="auto"><span class="rt2" style="margin:0">${esc(l.msg||'')}</span></span></div>`;
    h+=`</div>`; }
  st.innerHTML=h;
  if(poll&&VIEW==='now'){ POLL=setInterval(()=>{if(VIEW==='now')viewNow(document.getElementById('stage'),false);},12000); }
}

/* ---------- JUDGE (inline top-20 verdict — reuses /api/approvals/{items,answer,reverse}) ---------- */
// one verdict spine: the SAME feed + write path /dashboard uses. Nothing new-tracks here.
const JD={};   // per-card draft {verdict,rating,note} — mirrors dashboard's D, kept per item id
function isJudgeable(it){ return it.kind==='caption_judge'||String(it.id).startsWith('post_'); }
function optImg(o){ // an option image: explicit image_url, else the render_asset stamped by the renders ledger
  if(o.image_url) return o.image_url;
  const ra=o.render_asset||(o.visual&&o.visual.render_asset)||(o.payload&&o.payload.visual&&o.payload.visual.render_asset);
  if(!ra) return '';
  return String(ra).startsWith('/')||String(ra).startsWith('http')?ra:('/static/renders_v37/'+ra);
}
function optCap(o){ return o.caption||o.island_text||o.text||o.best||''; }
function optScore(o){ const s=o.score??o.taste??o.rubric_score??(o.scores&&(o.scores.taste??o.scores.total)); return (s||s===0)?s:null; }

async function viewJudge(st,poll){
  const a=await fetchJSON('/api/approvals/items');
  if(a&&a.error){ st.innerHTML=errBox(a); return; }
  const all=Array.isArray(a)?a:[];
  const cards=all.filter(isJudgeable);
  const open=cards.filter(x=>x.status!=='answered');
  // most-recently-judged first (a fresh verdict surfaces at the top, reversible)
  const done=cards.filter(x=>x.status==='answered')
    .sort((a,b)=>String(b.created||'').localeCompare(String(a.created||''))).slice(0,10);
  JUDGE_N=open.length; renderTabs();
  let h=`<div class="jnote">⚖️ <b>Judge the top-20 here</b> — full posts the factory filtered + scored, judged inline. Same verdict as the deep board. <a href="/dashboard?k=${encodeURIComponent(K)}">افتح لوحة المراجعة الكاملة ↗</a></div>`;
  if(!WHO){ h+=`<div class="jbatch" style="border-color:var(--epink);color:var(--epink)">هذا المفتاح للقراءة فقط — الحكم يحتاج مفتاح قاضٍ.</div>`; st.innerHTML=h; return; }
  // OPEN cards
  if(!open.length){
    h+=`<div class="empty"><div class="e">🫧</div>top 0 — المصنع يصفّي<div class="dim" style="font-size:12.5px;margin-top:8px">لا مسودّة عبرت بوابة الذوق بعد. تظهر هنا لحظة ما يجهّزها المصنع.</div></div>`;
  } else {
    for(const it of open) h+=judgeCard(it,false);
  }
  // recently judged (with reverse)
  if(done.length){ h+=`<div class="h1">Recently judged</div>`; for(const it of done) h+=judgeCard(it,true); }
  st.innerHTML=h;
  open.forEach(it=>{ if((it.options||[]).length) renderBatchBars(it); else renderBar(it.id); });
  if(poll&&VIEW==='judge'){ POLL=setInterval(()=>{ if(VIEW==='judge'&&!Object.values(JD).some(d=>d&&d.dirty)) viewJudge(document.getElementById('stage'),false); },12000); }
}
function judgeCard(it,isDone){
  // a BATCH card carries an options[] array; an empty batch = honest top-0 (the factory is still filtering),
  // NOT a votable card — never render a lone verdict bar on nothing.
  const isBatch=Array.isArray(it.options);
  const opts=it.options||[];
  if(isBatch&&!opts.length&&!isDone){
    return `<div class="jcard" id="jc_${cssid(it.id)}">

      ${it.why?`<div class="jctx" dir="auto"><span class="k">rule</span> ${esc(it.why)}</div>`:''}</div>`;
  }
  let inner='';

    // BATCH shape: each option = caption + score + render image + its own verdict controls
    inner=`<div class="jctx" dir="auto">${esc(it.why||'')}</div>`;
    opts.forEach((o,i)=>{
      const oid=it.id+'::'+i; const img=optImg(o); const sc=optScore(o);

        <div class="jcap" dir="auto">${esc(optCap(o))}</div>
        ${barHtml(oid,isDone,o)}</div>`;
    });
  } else {
    // FLAT per-post shape (the shape /dashboard renders): image + caption + why/need/did
    const img=it.image_url;
    inner=`${img?`<img class="jimg" src="${esc(img)}" loading="lazy" alt="" onerror="this.style.display='none'">`:''}
      <div class="jseclbl">Caption</div><div class="jcap" dir="auto">${esc(it.caption||it.island_text||'')}</div>
      ${it.why?`<div class="jctx" dir="auto"><span class="k">why</span> ${esc(it.why)}</div>`:''}
      ${it.need?`<div class="jctx" dir="auto"><span class="k">need</span> ${esc(it.need)}</div>`:''}
      ${it.did?`<div class="jctx" dir="auto"><span class="k">did</span> ${esc(it.did)}</div>`:''}
      ${barHtml(it.id,isDone,it)}`;
  }
  return `<div class="jcard ${isDone?'done':''}" id="jc_${cssid(it.id)}">
    <div class="jhead"><span class="dot ${isDone?(it.answered==='approved'?'on':(it.answered==='rejected'?'bad':'')):'on'}"></span>
      <span class="jhandle" dir="auto">${esc(it.handle||it.title||it.id)}</span>
      <span class="jmeta">${esc(it.occasion||it.tag||'')}</span></div>
    ${inner}</div>`;
}
const cssid=s=>String(s).replace(/[^a-zA-Z0-9_-]/g,'_');

function wfSteps(a){

    <div class="strip"><div class="stat"><div class="n">${fmt$(d.today_usd)}</div><div class="l">today / ${fmt$(caps.usd_per_day)}</div><div class="bar"><i class="${cls(dp)}" style="width:${dp}%"></i></div></div>
    <div class="stat"><div class="n">${fmt$(d.month_usd)}</div><div class="l">month / ${fmt$(caps.usd_per_month)}</div><div class="bar"><i class="${cls(mp)}" style="width:${mp}%"></i></div></div>
    <div class="stat"><div class="n">${fmt$(prop)}</div><div class="l">proposal / ${fmt$(caps.proposal_monthly_usd)}</div><div class="bar"><i class="${cls(pp)}" style="width:${pp}%"></i></div></div></div>
    <div class="dim" style="font-size:12px;margin:8px 2px">Jadarat proposal is on its own meter — not capped by the daily budget.</div>
    <div class="h1">By model</div><div class="card" style="padding:4px 20px">`;
  for(const m of (d.by_model||[])) h+=`<div class="row"><span class="rowb"><span class="rt1">${esc(m.model)} <span class="chip">${m.calls}</span></span></span><span class="rtime">${fmt$(m.usd)}</span></div>`;
  st.innerHTML=h+`</div>`; }

async function subHealth(st,back){ const d=await fetchJSON('/api/control/health'); if(!d.ok){st.innerHTML=back+errBox(d);return;}
  let h=back+`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="dot ${d.status==='healthy'?'on':(d.status==='critical'?'bad':'recent')}"></span><b>${esc(d.status)}</b> <button class="refresh" style="margin-inline-start:auto" onclick="openSub('health')">↻ re-check</button></div>
    <div class="h1">Services</div><div class="card" style="padding:4px 20px">`;
  for(const s of (d.services||[])) h+=`<div class="row"><span class="dot ${s.up?'on':'bad'}"></span><span class="rowb"><span class="rt1">${esc(s.name)} <span class="chip">:${s.port}</span></span><span class="rt2">${esc(s.detail)} · ${esc(String(s.http_code))}</span></span></div>`;
  h+=`</div><div class="h1">Tunnels</div><div class="card" style="padding:4px 20px">`;
  for(const t of (d.tunnels||[])) h+=`<div class="row"><span class="dot ${t.up?'on':'bad'}"></span><span class="rowb"><span class="rt1">${esc(t.name)}</span><span class="rt2 mono">${esc(t.detail)}</span></span></div>`;
  h+=`</div><div class="h1">Last commits</div><div class="card" style="padding:4px 20px">`;
  for(const c of (d.commits||[])) h+=`<div class="row"><span class="rowb"><span class="rt1">${esc(c.repo)} <span class="chip mono">${esc(c.hash)}</span></span><span class="rt2">${esc(c.msg)}</span></span><span class="rtime">${c.age_hours}h</span></div>`;
  st.innerHTML=h+`</div>`; }

async function subActivity(st,back){ const d=await fetchJSON('/api/dashboard/activity'); const rows=(d&&d.rows)||[];
  if(!rows.length){st.innerHTML=back+'<div class="empty"><div class="e">🌙</div>لا نشاط</div>';return;}
  const AICO={'files-added':'➕','files-modified':'✏️','files-vanished':'⚠️','files-moved':'📁','session':'📦','learning-learned':'🧠','learning-correction':'🛠️','learning-verdict':'⚖️','verdict':'✅'};
  const today=new Date().toLocaleDateString('en-CA');
  let h=back,day=null;
  for(const r of rows){ const dk=new Date(r.ts*1000).toLocaleDateString('en-CA');
    if(dk!==day){day=dk; h+=`<div class="dayhdr">${dk===today?'today':dk}</div>`;}
    const t=new Date(r.ts*1000),hh=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    h+=`<div class="row"><span style="font-size:16px">${AICO[r.kind]||'·'}</span><span class="rowb"><span class="rt1" style="font-weight:500;font-size:13.5px"><span class="chip">${esc(r.who)}</span> ${esc(r.text)}</span></span><span class="rtime">${hh}</span></div>`; }
  st.innerHTML=h; }

/* prime the Judge tab badge from the shared feed (so the count shows before the tab is opened) */
async function refreshJudgeCount(){ const a=await fetchJSON('/api/approvals/items');
  if(Array.isArray(a)){ JUDGE_N=a.filter(x=>isJudgeable(x)&&x.status!=='answered').length; renderTabs(); } }
/* boot */
(async()=>{ if(await whoami()){ renderTabs(); refreshSys(); refreshJudgeCount(); render(); setInterval(refreshSys,60000); setInterval(refreshJudgeCount,60000); } })();
</script>
